# railway.toml
# Configuration for the web (FastAPI) service.
# The worker service is a second Railway service pointing to the same repo
# with startCommand = "arq api.worker.WorkerSettings" set in the dashboard.
#
# Required environment variables (set in Railway dashboard for both services):
#   DATABASE_URL  — injected automatically by the Postgres plugin
#   REDIS_URL     — injected automatically by the Redis plugin
#   RATE_LIMIT_REQUESTS=60
#   RATE_LIMIT_WINDOW_SECONDS=60
#   JOB_FILE_TTL_SECONDS=60
#   JOB_RESULT_TTL_SECONDS=300
#   INLINE_WAIT_SECONDS=12.0

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn api.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
